# ===================================================================
# J-TICKET APPLICATION CONFIGURATION
# ===================================================================

# --- GENERAL ---
spring.application.name=J-Ticket
server.port=8081

# --- DATABASE CONNECTION ---
spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_NAME}?serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE ---
# Dialect ensures optimized SQL generation for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# VALIDATE strategy: Prevents the app from starting if the Java Entities 
# don't match the Flyway schema.
spring.jpa.hibernate.ddl-auto=validate

# Logging SQL for development debugging. 
# Disable in high-traffic production.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# stored and retrieved in UTC regardless of the server's local time.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- FLYWAY (Database Migration) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.create-schemas=true

# Baseline ensures Flyway can take control of an existing database if needed
spring.flyway.baseline-on-migrate=true
